# Render Blueprint — https://render.com/docs/blueprint-spec
# Single-VM app with light / medium / heavy presets; medium is the default.
# Randomised return-based output (final-return/IIFE), no top-level locals, no loadstring.
# Push this repo to GitHub, then: Render Dashboard -> New -> Blueprint -> pick repo.
services:
  - type: web
    name: luau-obf
    runtime: python
    plan: free
    region: singapore
    buildCommand: "pip install -r requirements.txt && python3 obf/fetch_tools.py"
    startCommand: "python3 -m obf.web"
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: OBF_TIMEOUT
        value: "60"
      - key: OBF_MAX_SOURCE
        value: "262144"
      - key: OBF_MAX_BODY
        value: "33554432"
      - key: OBF_RATE_LIMIT
        value: "24"
      - key: OBF_ALLOWED_ORIGIN
        value: "*"
      # Optional shared secret. Set a value in the Render dashboard to require
      # an X-API-Key header; leave blank to keep the instance open.
      - key: OBF_API_KEY
        sync: false
      # Optional loadstring publisher. Set the three sync:false values manually
      # on an existing Blueprint; see LOADSTRINGS.md.
      - key: OBF_GITHUB_TOKEN
        sync: false
      - key: OBF_GITHUB_OWNER
        sync: false
      - key: OBF_GITHUB_REPO
        sync: false
      - key: OBF_GITHUB_BRANCH
        value: "main"
      - key: OBF_GITHUB_PATH
        value: "loadstrings"
      - key: OBF_MAX_PUBLISH
        value: "16777216"
